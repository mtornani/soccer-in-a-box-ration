<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#4A5431">
    <title>Soccer in a Box</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
</head>
<body>
    <header class="brand">
        <span class="brand-name">Soccer in a Box</span>
        <span class="brand-state" id="net-state">Offline pronto</span>
    </header>

    <main class="container">
        <section id="logistics-mode" class="mode-container">
            <h1 class="screen-title">Razioni</h1>
            <p class="screen-lead">Sessioni complete, già sul telefono. Funzionano senza rete.</p>
            <div id="ration-list"></div>
        </section>

        <section id="field-mode" class="mode-container hidden">
            <div class="field-head">
                <span id="phase-count"></span>
                <button class="btn-text" id="complete-op-btn">Chiudi sessione</button>
            </div>
            <div id="phase-timer" aria-live="polite">00:00</div>
            <div id="phase-content"></div>
        </section>

        <section id="exercises-section" class="mode-container hidden">
            <h1 class="screen-title">Esercizi</h1>
            <div id="exercise-filters" class="filter-bar">
                <div class="filter-group">
                    <label for="category-filter">Area</label>
                    <select id="category-filter">
                        <option value="all">Tutte</option>
                        <option value="technical">Tecnica</option>
                        <option value="athletic">Atletica</option>
                        <option value="tactical">Tattica</option>
                        <option value="psychological">Mentale</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="age-filter">Età: <span id="age-value">45</span></label>
                    <input type="range" id="age-filter" min="6" max="45" value="45">
                </div>
                <div class="filter-group">
                    <label for="participants-filter">Giocatori disponibili</label>
                    <input type="number" id="participants-filter" min="1" max="30" value="20">
                </div>
            </div>
            <div id="exercises-grid" class="card-grid"></div>
        </section>
    </main>

    <nav class="tabbar">
        <button class="tab is-active" id="show-rations-btn">Razioni</button>
        <button class="tab" id="show-exercises-btn">Esercizi</button>
    </nav>

    <script type="module" src="js/app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('service-worker.js')
            .catch(err => console.warn('SW registration failed', err));
        });
      }
    </script>
</body>
</html>
