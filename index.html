<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soccer In A Box - Military Ration</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #00ff41;
            --accent-color: #ffffff;
            --border-color: #333;
            --danger-color: #ff4141;
        }
        body.tactical-dark {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            text-transform: uppercase;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            border: 2px solid var(--border-color);
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
        }
        h1, h2 {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        .button {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            font-weight: bold;
            display: block;
            width: 100%;
            margin-top: 20px;
        }
        .button:hover {
            background: var(--text-color);
            color: var(--bg-color);
        }
        .hidden {
            display: none;
        }
        .ration-item {
            border: 1px solid var(--border-color);
            padding: 10px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }
        #phase-timer {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent-color);
        }
        #phase-content {
            min-height: 200px;
            border: 1px dashed var(--border-color);
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body class="tactical-dark">
    <div class="container">
        <div id="logistics-mode">
            <h1>LOGISTICS MODE</h1>
            <p>RATION PACK: SOCCER-RATION-01</p>
            <div id="ration-list">
                <!-- Ration list content will be injected here -->
                <div class="ration-item">
                    <span>EQUIPMENT: CHECKED</span>
                    <span>[OK]</span>
                </div>
            </div>
            <button class="button" id="enter-field-btn">ENTER FIELD MODE</button>
        </div>

        <div id="field-mode" class="hidden">
            <h1>FIELD MODE: OPERATIONAL</h1>
            <div id="phase-timer">00:00</div>
            <div id="phase-content">
                <!-- Phase content will be injected here -->
                READY FOR DEPLOYMENT...
            </div>
            <button class="button" id="next-phase-btn">NEXT PHASE</button>
            <button class="button" id="complete-op-btn" style="color: var(--danger-color); border-color: var(--danger-color);">COMPLETE OPERATION</button>
        </div>
    </div>
    <script>
        document.getElementById('enter-field-btn').addEventListener('click', () => {
            document.getElementById('logistics-mode').classList.add('hidden');
            document.getElementById('field-mode').classList.remove('hidden');
        });
    </script>
</body>
</html>
