<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoccerInABox - Ration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="tactical-dark">
    <button id="lang-toggle" class="lang-toggle">EN</button>

    <div class="container">
        <div id="logistics-mode" class="mode-container">
            <h1 data-i18n="logisticsTitle">MODALITÀ LOGISTICA</h1>
            <p data-i18n="rationPack">RAZIONE: SOCCER-RATION-01</p>
            <div id="ration-list">
                <div class="ration-item">
                    <span data-i18n="noRations">NESSUNA RAZIONE CARICATA</span>
                    <span>[<span data-i18n="rationEmpty">VUOTA</span>]</span>
                </div>
            </div>
            <button class="btn-brutal" id="load-test-btn" data-i18n="loadBtn">CARICA RAZIONE TEST</button>
            <button class="btn-brutal" id="enter-field-btn" data-i18n="enterFieldBtn">ENTRA IN CAMPO</button>
        </div>

        <div id="field-mode" class="mode-container hidden">
            <h1 data-i18n="fieldTitle">MODALITÀ CAMPO: OPERATIVA</h1>
            <div id="phase-timer">00:00</div>
            <div id="phase-content">
                READY FOR DEPLOYMENT...
            </div>
            <button class="btn-brutal" id="next-phase-btn" data-i18n="nextPhaseBtn">FASE SUCCESSIVA</button>
            <button class="btn-brutal" id="back-to-base-btn" data-i18n="returnBtn">TORNA ALLA BASE</button>
        </div>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
